services:
  app:
    build: .
    container_name: mywebsite-app
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - ./app:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Production reads the key from AWS Secrets Manager with the EC2 instance role.
      # ANTHROPIC_API_KEY (optional) overrides it, e.g. for local testing.
      - ANTHROPIC_API_KEY_SECRET_ARN=${ANTHROPIC_API_KEY_SECRET_ARN:-arn:aws:secretsmanager:us-east-1:704505749045:secret:ANTHROPIC_API_KEY-8zOBNU}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-5-5}
      - ASK_DAILY_BUDGET_USD=${ASK_DAILY_BUDGET_USD:-0.50}
      - ASK_MAX_PROMPTS_PER_SESSION=${ASK_MAX_PROMPTS_PER_SESSION:-20}
      - ASK_MAX_PROMPTS_PER_IP_PER_DAY=${ASK_MAX_PROMPTS_PER_IP_PER_DAY:-60}
      # Local fallback model. If the ollama service isn't running, the app skips it.
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}

  nginx:
    image: nginx:latest
    container_name: mywebsite-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - ./logs/nginx:/var/log/nginx
      - ./app/templates/error.html:/var/www/error_pages/error.html
      - ./app/static/files/blackcat-pipelines.jpg:/var/www/error_pages/blackcat-pipelines.jpg
    command: ["/bin/sh", "-c", "nginx -g 'daemon off;' & while :; do sleep 12h & wait $$!; nginx -s reload; done"]
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: mywebsite-certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"

  # Optional local model for /ask, used when the Claude budget is spent or Claude fails.
  # Start it with:  docker compose --profile local-llm up -d
  # Then pull the model once:  docker exec mywebsite-ollama ollama pull qwen2.5:1.5b
  ollama:
    image: ollama/ollama:latest
    container_name: mywebsite-ollama
    profiles: ["local-llm"]
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=15m
    # Leave room for nginx, the app and Postgres on a 4 GiB t3a.medium.
    mem_limit: 2g
    cpus: 1.5

  db:
    image: postgres:15-alpine
    container_name: mywebsite-db
    restart: always
    # Reachable only from the instance itself (for DBeaver/psql over an SSH tunnel).
    # Never publish 5432 on 0.0.0.0 or open it in the security group.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  ollama_models:
